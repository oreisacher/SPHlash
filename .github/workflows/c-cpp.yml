name: Build Project

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: "12.9.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
